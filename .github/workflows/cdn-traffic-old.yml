name: CDN Traffic Generator - Old Domain

on:
  workflow_dispatch:

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Generate CDN traffic
        run: |
          CDN="http://1a0c281b118eb47b.kinxzone.com"
          TOTAL=0
          echo "해외 CDN 트래픽 발생 시작... ($CDN)"

          for i in $(seq 1 20); do
            BYTES=$(curl -s -o /dev/null -w "%{size_download}" "${CDN}/bigfile.bin" 2>/dev/null || echo 0)
            TOTAL=$((TOTAL + BYTES))
            echo "[$i/20] 누적: $((TOTAL / 1024 / 1024))MB"
          done

          echo "완료! 총 트래픽: $((TOTAL / 1024 / 1024))MB"
